<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jurnal Trading AB</title>
<link rel="icon" type="image/png" href="logo-mark.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0e1117;
    --bg-2:#151a23;
    --panel:#1a212c;
    --panel-2:#212a37;
    --border:#2b3644;
    --text:#e6edf3;
    --muted:#8b98a9;
    --accent:#2f83d6;
    --accent-soft:rgba(47,131,214,.16);
    --green:#18b98a;
    --green-soft:rgba(24,185,138,.14);
    --red:#ff5c6c;
    --red-soft:rgba(255,92,108,.12);
    --logo-grad:linear-gradient(135deg,#18b98a,#2f83d6);
    --amber:#f0b429;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.42,.5,1);
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef1f6;
    --bg-2:#e3e8f0;
    --panel:#ffffff;
    --panel-2:#f4f6fa;
    --border:#d7deea;
    --text:#1a2230;
    --muted:#67728a;
    --accent:#2168c0;
    --accent-soft:rgba(33,104,192,.12);
    --green:#0e9e6e;
    --green-soft:rgba(14,158,110,.12);
    --red:#e23a4c;
    --red-soft:rgba(226,58,76,.10);
    --shadow:0 10px 30px rgba(20,40,80,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    background:linear-gradient(160deg,var(--bg),var(--bg-2));
    color:var(--text);
    min-height:100vh;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 20px;
    background:rgba(14,17,23,.75);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
  }
  :root[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:var(--logo-grad);
    display:grid;place-items:center;color:#fff;font-size:16px;
  }
  .brand-logo{height:34px;width:auto;flex-shrink:0;display:block}
  .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.ghost{background:transparent}
  .btn.icon{padding:9px;width:38px;justify-content:center}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn:active{transform:translateY(1px) scale(.985);transition-duration:.08s}

  /* ---------- Sheet nav ---------- */
  .sheetnav{display:flex;align-items:center;gap:6px}
  .sheetnav select{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;max-width:230px;
  }

  /* ---------- Page ---------- */
  .wrap{max-width:1200px;margin:0 auto;padding:26px 20px 80px;animation:riseIn .6s var(--ease-out) both}

  .sheet-head{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);
  }
  .title-input{
    width:100%;background:transparent;border:none;color:var(--text);
    font-size:28px;font-weight:800;letter-spacing:.2px;padding:2px 0;
    border-bottom:2px solid transparent;transition:.15s;
  }
  .title-input:focus{outline:none;border-bottom-color:var(--accent)}
  .month-row{display:flex;align-items:center;gap:10px;margin-top:8px}
  .month-row label{color:var(--muted);font-size:13px;font-weight:600}
  .month-input{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:9px;font-size:14px;font-weight:600;min-width:180px;
  }
  .month-input:focus{outline:none;border-color:var(--accent)}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  }
  .stat .label{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .stat .value{font-size:23px;font-weight:800;margin-top:5px}
  .stat .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pos{color:var(--green)} .neg{color:var(--red)}

  /* ---------- Grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{
    position:relative;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:12px;min-height:104px;cursor:pointer;
    display:flex;flex-direction:column;
    transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .15s ease,background .2s ease;
  }
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}
  .card:active{transform:translateY(-1px) scale(.99);transition-duration:.08s}
  .card.filled.win{background:linear-gradient(160deg,var(--green-soft),var(--panel));border-color:rgba(24,185,138,.35)}
  .card.filled.loss{background:linear-gradient(160deg,var(--red-soft),var(--panel));border-color:rgba(255,92,108,.35)}
  .card.filled.flat{background:var(--panel-2)}
  .card .num{
    position:absolute;top:9px;right:11px;font-size:12px;font-weight:800;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--border);border-radius:7px;
    min-width:24px;height:22px;display:grid;place-items:center;padding:0 5px;
  }
  .card .date{font-size:12px;color:var(--muted);font-weight:600}
  .card .pnl{font-size:20px;font-weight:800;margin-top:auto}
  .card .meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .card .empty-hint{margin:auto;color:var(--muted);opacity:.55;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .card .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted)}
  .tag.long{color:var(--green);border-color:rgba(24,185,138,.4)}
  .tag.short{color:var(--red);border-color:rgba(255,92,108,.4)}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;
    backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .22s var(--ease-out),visibility .22s;
  }
  .overlay.open{opacity:1;visibility:visible}
  .modal{
    width:100%;max-width:640px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;box-shadow:var(--shadow);
  }
  .overlay.open .modal{animation:pop .4s var(--ease-out) both}
  @keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
  .modal-head h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
  .modal-head .badge{background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px}
  .modal-body{padding:20px 22px}
  .modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:9px;font-size:14px;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .pos-header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .pos-header .t{font-size:13px;font-weight:800;letter-spacing:.4px}
  .positions{display:flex;flex-direction:column;gap:14px}
  .prow{
    background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:16px 12px 12px;
    position:relative;
  }
  .prow .pidx{position:absolute;top:-9px;left:12px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
  .prow .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
  .prow .mini label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  .prow .mini input,.prow .mini select{
    width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:8px 9px;border-radius:8px;font-size:13px;
  }
  .prow .mini input:focus,.prow .mini select:focus{outline:none;border-color:var(--accent)}
  .prow .span2{grid-column:span 2}
  .prow .rm{
    position:absolute;top:-9px;right:10px;
    width:28px;height:28px;border-radius:8px;background:var(--panel);border:1px solid var(--border);
    color:var(--muted);font-size:14px;display:grid;place-items:center;
  }
  .prow .rm:hover{color:var(--red);border-color:var(--red)}
  .empty-pos{color:var(--muted);font-size:13px;text-align:center;padding:14px;border:1px dashed var(--border);border-radius:10px}

  /* money input with currency prefix */
  .money-input{position:relative;display:flex;align-items:center}
  .money-input .cur{position:absolute;left:10px;color:var(--muted);font-weight:700;font-size:13px;pointer-events:none}
  .money-input input{padding-left:34px !important}

  /* TP / SL toggle */
  .res-toggle{display:flex;gap:6px}
  .res-btn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--panel);
    font-size:12px;font-weight:800;color:var(--muted);transition:.12s;letter-spacing:.4px}
  .res-btn:hover{border-color:var(--muted)}
  .res-btn.tp.active{background:var(--green-soft);color:var(--green);border-color:var(--green)}
  .res-btn.sl.active{background:var(--red-soft);color:var(--red);border-color:var(--red)}

  /* screenshot */
  .shot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .shot .upload{padding:8px 12px;font-size:12px}
  .shot .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:zoom-in}
  .shot .rmimg{padding:6px 10px;font-size:12px}

  /* lightbox */
  .lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.85);display:flex;
    align-items:center;justify-content:center;padding:30px;cursor:zoom-out;
    opacity:0;visibility:hidden;transition:opacity .2s var(--ease-out),visibility .2s}
  .lightbox.open{opacity:1;visibility:visible}
  .lightbox.open img{animation:pop .42s var(--ease-out) both}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:var(--shadow)}

  .cur-select{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:10px;font-size:13px;font-weight:700;
  }

  .day-summary{
    display:flex;gap:18px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:12px 16px;margin-top:16px;
  }
  .day-summary div span{display:block}
  .day-summary .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .day-summary .v{font-size:17px;font-weight:800;margin-top:2px}

  .foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Cloud / Auth ---------- */
  .cloud-only{display:none !important}
  body.cloud .cloud-only{display:inline-flex !important}
  .user-chip{align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cloud-status{align-items:center;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;border:1px solid var(--border);color:var(--muted);background:var(--panel);white-space:nowrap}
  .cloud-status.saving{color:var(--amber);border-color:rgba(240,180,41,.5)}
  .cloud-status.saved{color:var(--green);border-color:rgba(24,185,138,.4)}
  .cloud-status.error{color:var(--red);border-color:var(--red)}

  /* ---------- Account / Profile ---------- */
  .account{position:relative}
  .account-btn{
    display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border-radius:22px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:13px;transition:.15s;
  }
  .account-btn:hover{border-color:var(--accent)}
  .account-btn .caret{color:var(--muted);font-size:10px}
  .account-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;overflow:hidden;
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--logo-grad);
  }
  .avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
  .avatar-lg{width:54px;height:54px;font-size:21px}
  .account-menu{
    position:absolute;top:calc(100% + 8px);right:0;width:280px;max-width:calc(100vw - 32px);z-index:70;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px;
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .2s var(--ease-out),transform .2s var(--ease-out),visibility .2s;
  }
  .account-menu.open{opacity:1;visibility:visible;transform:none}
  .account-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .account-head-info{min-width:0}
  .account-head-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account-head-email{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .account-field{margin-bottom:12px}
  .account-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .account-field input,.account-field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:9px;font-size:13px;font-family:inherit;resize:none;
  }
  .account-field input:focus,.account-field textarea:focus{outline:none;border-color:var(--accent)}
  .account-actions .btn{width:100%;justify-content:center}
  .account-logout{width:100%;justify-content:center;margin-top:8px;color:var(--red)}
  .account-logout:hover{border-color:var(--red);color:var(--red)}

  .auth{
    position:fixed;inset:0;z-index:200;display:flex;
    align-items:center;justify-content:center;padding:24px;overflow:auto;
    background:linear-gradient(150deg,#e8f4fb 0%,#edf4f0 55%,#e6f5ee 100%);
    opacity:0;visibility:hidden;transition:opacity .3s var(--ease-out),visibility .3s;
  }
  .auth.show{opacity:1;visibility:visible}
  .auth.show .auth-card{animation:pop .52s var(--ease-out) both}
  .auth.show .auth-logo{animation:pop .72s var(--ease-spring) both;animation-delay:.08s}
  .auth-card{
    width:100%;max-width:410px;background:#ffffff;border:1px solid #e4ebf3;
    border-radius:20px;box-shadow:0 24px 60px rgba(18,46,84,.20);padding:30px 28px;
  }
  .auth-logo{display:block;width:100%;max-width:280px;margin:0 auto 16px;height:auto}
  .auth-sub{color:#5c6b81;font-size:13.5px;margin-bottom:22px;line-height:1.5;text-align:center}
  .auth-field{margin-bottom:14px}
  .auth-field label{display:block;font-size:12px;font-weight:700;color:#54637a;margin-bottom:6px}
  .auth-field input{
    width:100%;background:#f4f8fc;border:1px solid #dbe4ef;color:#17293f;
    padding:12px 13px;border-radius:11px;font-size:14px;transition:border-color .15s,box-shadow .15s;
  }
  .auth-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .auth-btn{width:100%;justify-content:center;margin-top:6px;padding:12px;font-size:14px}
  .auth-toggle{text-align:center;margin-top:16px;font-size:13px;color:#5c6b81}
  .auth-toggle a{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline}
  .auth-forgot{text-align:right;margin-top:8px}
  .auth-forgot a{color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline}
  .auth-msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:9px;display:none;line-height:1.45}
  .auth-msg.err{display:block;background:var(--red-soft);color:var(--red);border:1px solid rgba(255,92,108,.35)}
  .auth-msg.ok{display:block;background:var(--green-soft);color:var(--green);border:1px solid rgba(24,185,138,.35)}

  /* entrance + aksesibilitas gerak */
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .pop-in{animation:cardPop .6s var(--ease-out) both}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  }

  @media(max-width:560px){
    .prow .grid3{grid-template-columns:1fr 1fr;gap:8px}
    .prow .span2{grid-column:span 2}
    .two{grid-template-columns:1fr}
    .title-input{font-size:22px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><img class="brand-logo" src="logo-mark.png" alt="Jurnal Trading AB" /><span>Jurnal Trading AB</span></div>
  <div class="sheetnav">
    <button class="btn icon" id="prevSheet" title="Halaman sebelumnya">‹</button>
    <select id="sheetSelect" title="Pilih halaman"></select>
    <button class="btn icon" id="nextSheet" title="Halaman berikutnya">›</button>
  </div>
  <button class="btn" id="newSheet">+ Halaman Baru</button>
  <div class="spacer"></div>
  <span class="cloud-status cloud-only" id="cloudStatus">● cloud</span>
  <select id="curSelect" class="cur-select" title="Mata uang">
    <option value="USD">$ Dollar</option>
    <option value="IDR">Rp Rupiah</option>
  </select>
  <button class="btn ghost" id="exportBtn" title="Unduh cadangan data ke file .json">⬇ Backup</button>
  <button class="btn ghost" id="importBtn" title="Pulihkan data dari file .json">⬆ Pulihkan</button>
  <button class="btn ghost" id="themeBtn" title="Ganti tema terang / gelap"><span id="themeIcon">🌙</span> Tema</button>
  <div class="account cloud-only" id="account">
    <button class="account-btn" id="accountBtn" title="Akun saya">
      <span class="avatar" id="avatar">?</span>
      <span class="account-name" id="accountName">Akun</span>
      <span class="caret">▾</span>
    </button>
    <div class="account-menu" id="accountMenu">
      <div class="account-head">
        <span class="avatar avatar-lg" id="avatarLg">?</span>
        <div class="account-head-info">
          <div class="account-head-name" id="menuNickname">—</div>
          <div class="account-head-email" id="menuEmail">—</div>
        </div>
      </div>
      <div class="account-field">
        <label>Nama / Nickname</label>
        <input type="text" id="profNickname" maxlength="40" placeholder="Nama tampilanmu" />
      </div>
      <div class="account-field">
        <label>Deskripsi</label>
        <textarea id="profDesc" maxlength="160" rows="2" placeholder="cth: Scalper XAUUSD, sesi London"></textarea>
      </div>
      <div class="account-actions">
        <button class="btn primary" id="profSave">💾 Simpan Profil</button>
      </div>

    </div>

</div>

  <div class="sheet-head">
    <input class="title-input" id="sheetTitle" placeholder="Judul halaman (mis. Jurnal Trading AB XAU)" />
    <div class="month-row">
      <label for="sheetMonth">Bulan</label>

        <option>Januari 2026</option><option>Februari 2026</option><option>Maret 2026</option>
        <option>April 2026</option><option>Mei 2026</option><option>Juni 2026</option>
        <option>Juli 2026</option><option>Agustus 2026</option><option>September 2026</option>

  <div class="stats" id="stats"></div>

<div class="auth" id="authScreen">

    <div class="auth-msg" id="authMsg"></div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Slot <span class="badge" id="mSlot">#1</span></h3>
      <button class="btn ghost icon" id="mClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="two">
        <div class="field">
          <label>Tanggal Entry</label>
          <input type="date" id="mDate" />
        </div>
        <div class="field">
          <label>Jumlah Open Posisi</label>
          <input type="number" id="mCount" min="0" step="1" value="0" />
        </div>
      </div>

      <div class="pos-header">
        <span class="t">Detail Posisi</span>
        <button class="btn ghost" id="mAddPos" style="padding:6px 11px;font-size:12px">+ Tambah Posisi</button>
      </div>
      <div class="positions" id="mPositions"></div>

      <div class="field" style="margin-top:16px">
        <label>Catatan (opsional)</label>
        <input type="text" id="mNote" placeholder="mis. news NFP, sesi London, revenge trade dihindari…" />
      </div>

      <div class="day-summary">
        <div><span class="k">Total Posisi</span><span class="v" id="dsCount">0</span></div>
        <div><span class="k">Net P/L Hari Ini</span><span class="v" id="dsPnl">0</span></div>
        <div><span class="k">Win / Loss</span><span class="v" id="dsWL">0 / 0</span></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" id="mSave">💾 Simpan</button>
      <button class="btn danger" id="mClear">Kosongkan Slot</button>

      <button class="btn ghost" id="mCancel">Batal</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="screenshot" /></div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const KEY="scalperJournal_v1";
  const SLOTS=31;
  const MARKETS=["XAUUSD","EURUSD","GBPUSD","USDJPY","GBPJPY","AUDUSD","US30","NAS100","BTCUSD","ETHUSD"];

  // ======================================================================
  //  KONFIGURASI CLOUD  — isi 2 baris ini setelah membuat project Supabase.
  //  Lihat PANDUAN-SETUP.md. Selama masih "__..." aplikasi jalan mode OFFLINE.
  // ======================================================================
  const SUPABASE_URL="https://gzmvktzrnlbhtxgmazat.supabase.co";
  const SUPABASE_ANON_KEY="sb_publishable_kaKgvE_-bEZNo5uhzfobUQ_cScPzrU3";
  const CLOUD=SUPABASE_URL.indexOf("http")===0 && SUPABASE_ANON_KEY.length>20;
  let sb=null, currentUser=null;

  // ---------- State ----------
  let state=null;
  let editingSlot=null;
  let editTrades=[]; // temp positions while modal open

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

  function blankSheet(n){
    return {id:uid(), title:"Jurnal Trading AB"+(n?(" "+n):""), month:"", days:{}};
  }
  function sanitize(s){
    if(!s||!Array.isArray(s.sheets))return s;
    s.sheets.forEach(sh=>{
      if(!sh.days||typeof sh.days!=="object")sh.days={};
      Object.keys(sh.days).forEach(k=>{
        const n=parseInt(k,10);
        const d=sh.days[k];
        if(!(n>=1&&n<=SLOTS)||!d||typeof d!=="object"){delete sh.days[k];return;}
        if(!Array.isArray(d.trades))d.trades=[];
      });
    });
    return s;
  }
  // Akses localStorage yang aman: di mode privat / storage diblokir,
  // localStorage bisa melempar error dan mematikan seluruh aplikasi.
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

  function localLoad(){
    try{
      const raw=lsGet(KEY);
      if(raw){const s=JSON.parse(raw); if(s&&s.sheets&&s.sheets.length) return sanitize(s);}
    }catch(e){}
    const first=blankSheet();
    return {sheets:[first], active:first.id, currency:"USD"};
  }
  function localSave(){
    if(!lsSet(KEY,JSON.stringify(state)))
      toast("⚠ Gagal menyimpan: penyimpanan penuh atau diblokir browser");
  }

  // ----- Cloud data layer (Supabase) -----
  function setStatus(s){
    const el=document.getElementById("cloudStatus");if(!el)return;
    el.className="cloud-status cloud-only "+s;
    el.textContent=s==="saving"?"⏳ menyimpan…":(s==="saved"?"✓ tersimpan":(s==="error"?"⚠ gagal simpan":"● cloud"));
  }
  async function cloudSaveNow(){
    if(!sb||!currentUser)return;
    try{
      const {error}=await sb.from("journals").upsert({user_id:currentUser.id,data:state,updated_at:new Date().toISOString()});
      if(error)throw error;
      setStatus("saved");
    }catch(e){setStatus("error");toast("Gagal simpan ke cloud: "+(e.message||e));}
  }
  let cloudTimer=null;
  function scheduleCloudSave(){
    if(!sb||!currentUser)return;          // belum login: tidak ada yang disimpan
    setStatus("saving");
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(()=>{cloudTimer=null;cloudSaveNow();},1000);
  }
  // Pastikan perubahan terakhir tidak hilang bila tab ditutup/ditinggalkan
  // sebelum jeda 1 detik selesai.
  function flushCloudSave(){
    if(cloudTimer){clearTimeout(cloudTimer);cloudTimer=null;cloudSaveNow();}
  }
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden")flushCloudSave();
  });
  window.addEventListener("pagehide",flushCloudSave);
  window.addEventListener("beforeunload",e=>{
    if(cloudTimer){e.preventDefault();e.returnValue="";}
  });
  async function cloudLoad(){
    const {data,error}=await sb.from("journals").select("data").eq("user_id",currentUser.id).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&data.data.sheets&&data.data.sheets.length)return sanitize(data.data);
    const first=blankSheet();
    const fresh={sheets:[first],active:first.id,currency:"USD"};
    await sb.from("journals").upsert({user_id:currentUser.id,data:fresh,updated_at:new Date().toISOString()});
    return fresh;
  }

  // ----- Unified save -----
  function save(){
    if(CLOUD)scheduleCloudSave();
    else localSave();
  }
  function activeSheet(){return state.sheets.find(s=>s.id===state.active)||state.sheets[0]}

  // ---------- Helpers ----------
  function num(v){const n=parseFloat(v);return isNaN(n)?0:n}
  function curSymbol(){return (state.currency||"USD")==="IDR"?"Rp":"$"}
  function money(n){
    const sign=n<0?"-":(n>0?"+":"");
    const a=Math.abs(n);
    if((state.currency||"USD")==="IDR")
      return sign+"Rp"+a.toLocaleString("id-ID",{maximumFractionDigits:0});
    return sign+"$"+a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function dayTrades(sheet,slot){const d=sheet.days[slot];return d&&d.trades?d.trades:[]}
  function dayNet(sheet,slot){return dayTrades(sheet,slot).reduce((a,t)=>a+num(t.pnl),0)}

  // ---------- Render ----------
  function playEntrance(){
    const els=[].slice.call(document.querySelectorAll("#stats .stat"))
      .concat([].slice.call(document.querySelectorAll("#grid .card")));
    els.forEach((el,i)=>{
      el.classList.remove("pop-in");
      void el.offsetWidth;                       // restart animation
      el.style.animationDelay=(Math.min(i,26)*0.035)+"s";
      el.classList.add("pop-in");
    });
  }
  function render(animate){
    const sheet=activeSheet();
    // sheet selector
    const sel=document.getElementById("sheetSelect");
    sel.innerHTML="";
    state.sheets.forEach((s,i)=>{
      const o=document.createElement("option");
      o.value=s.id;
      o.textContent=(i+1)+". "+(s.title||"Tanpa Judul")+(s.month?(" — "+s.month):"");
      if(s.id===state.active)o.selected=true;
      sel.appendChild(o);
    });
    document.getElementById("sheetTitle").value=sheet.title||"";
    document.getElementById("sheetMonth").value=sheet.month||"";
    document.getElementById("curSelect").value=state.currency||"USD";

    renderStats(sheet);
    renderGrid(sheet);
    if(animate)playEntrance();
  }

  function renderStats(sheet){
    let net=0,trades=0,win=0,loss=0,activeDays=0,best=-Infinity,worst=Infinity;
    for(let i=1;i<=SLOTS;i++){
      const ts=dayTrades(sheet,i);
      if(ts.length){activeDays++;}
      let dn=0;
      ts.forEach(t=>{const p=num(t.pnl);net+=p;dn+=p;trades++;if(p>0)win++;else if(p<0)loss++;});
      if(ts.length){best=Math.max(best,dn);worst=Math.min(worst,dn);}
    }
    const wr=(win+loss)>0?Math.round(win/(win+loss)*100):0;
    const el=document.getElementById("stats");
    const netCls=net>0?"pos":(net<0?"neg":"");
    el.innerHTML=`
      <div class="stat"><div class="label">Net P/L Bulan Ini</div><div class="value ${netCls}">${money(net)}</div><div class="sub">${activeDays} hari aktif</div></div>
      <div class="stat"><div class="label">Total Trade</div><div class="value">${trades}</div><div class="sub">${win} profit · ${loss} loss</div></div>
      <div class="stat"><div class="label">Win Rate</div><div class="value">${wr}%</div><div class="sub">${win}/${win+loss} posisi</div></div>
      <div class="stat"><div class="label">Hari Terbaik</div><div class="value ${best>0?"pos":(best<0?"neg":"")}">${best>-Infinity?money(best):"–"}</div><div class="sub">Terburuk: <span class="neg">${worst<Infinity?money(worst):"–"}</span></div></div>
    `;
  }

  function renderGrid(sheet){
    const g=document.getElementById("grid");
    g.innerHTML="";
    for(let i=1;i<=SLOTS;i++){
      const ts=dayTrades(sheet,i);
      const d=sheet.days[i];
      const net=dayNet(sheet,i);
      const card=document.createElement("div");
      card.className="card";
      if(ts.length){
        card.classList.add("filled", net>0?"win":(net<0?"loss":"flat"));
        const longs=ts.filter(t=>t.dir==="Long").length;
        const shorts=ts.filter(t=>t.dir==="Short").length;
        const tp=ts.filter(t=>t.result==="TP").length;
        const sl=ts.filter(t=>t.result==="SL").length;
        const hasShot=ts.some(t=>t.img);
        const netCls=net>0?"pos":(net<0?"neg":"");
        const dateStr=d.date?formatDate(d.date):"—";
        card.innerHTML=`
          <span class="num">${i}</span>
          <div class="date">📅 ${dateStr}</div>
          <div class="pnl ${netCls}">${money(net)}</div>
          <div class="meta">
            <span>${ts.length} posisi</span>
            ${tp?`<span class="pos">✓${tp} TP</span>`:""}
            ${sl?`<span class="neg">✕${sl} SL</span>`:""}
            ${hasShot?`<span title="ada screenshot">📷</span>`:""}
          </div>
          <div class="tags">
            ${longs?`<span class="tag long">▲ ${longs} Long</span>`:""}
            ${shorts?`<span class="tag short">▼ ${shorts} Short</span>`:""}
          </div>`;
      }else{
        card.innerHTML=`<span class="num">${i}</span><div class="empty-hint">＋ Isi slot</div>`;
      }
      card.addEventListener("click",()=>openModal(i));
      g.appendChild(card);
    }
  }

  function formatDate(iso){
    try{
      const d=new Date(iso+"T00:00:00");
      return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"});
    }catch(e){return iso}
  }

  // ---------- Modal ----------
  function openModal(slot){
    editingSlot=slot;
    const sheet=activeSheet();
    const d=sheet.days[slot];
    document.getElementById("mSlot").textContent="#"+slot;
    document.getElementById("mDate").value=d&&d.date?d.date:"";
    document.getElementById("mNote").value=d&&d.note?d.note:"";
    editTrades=d&&d.trades?d.trades.map(t=>({dir:t.dir,pnl:t.pnl,market:t.market,result:t.result||"",img:t.img||""})):[];
    document.getElementById("mCount").value=editTrades.length;
    renderPositions();
    document.getElementById("overlay").classList.add("open");
  }
  function closeModal(){document.getElementById("overlay").classList.remove("open");editingSlot=null}

  function renderPositions(){
    const box=document.getElementById("mPositions");
    box.innerHTML="";
    if(editTrades.length===0){
      box.innerHTML=`<div class="empty-pos">Belum ada posisi. Atur "Jumlah Open Posisi" atau klik "Tambah Posisi".</div>`;
    }
    const sym=curSymbol();
    editTrades.forEach((t,idx)=>{
      const row=document.createElement("div");
      row.className="prow";
      row.innerHTML=`
        <span class="pidx">Posisi ${idx+1}</span>
        <button class="rm" data-rm="${idx}" title="Hapus posisi">✕</button>
        <div class="grid3">
          <div class="mini">
            <label>Posisi</label>
            <select data-f="dir" data-i="${idx}">
              <option value="Long"${t.dir==="Long"?" selected":""}>Long / Buy</option>
              <option value="Short"${t.dir==="Short"?" selected":""}>Short / Sell</option>
            </select>
          </div>
          <div class="mini">
            <label>Market</label>
            <input type="text" list="mkList" data-f="market" data-i="${idx}" value="${escapeHtml(t.market||"")}" placeholder="XAUUSD" />
          </div>
          <div class="mini">
            <label>Hasil (TP / SL)</label>
            <div class="res-toggle">
              <button type="button" class="res-btn tp${t.result==="TP"?" active":""}" data-res="TP" data-i="${idx}">TP</button>
              <button type="button" class="res-btn sl${t.result==="SL"?" active":""}" data-res="SL" data-i="${idx}">SL</button>
            </div>
          </div>
          <div class="mini">
            <label>Profit / Loss (${sym})</label>
            <div class="money-input">
              <span class="cur">${sym}</span>
              <input type="number" step="any" data-f="pnl" data-i="${idx}" value="${t.pnl!==undefined&&t.pnl!==""?t.pnl:""}" placeholder="0" />
            </div>
          </div>
          <div class="mini span2">
            <label>Screenshot (opsional)</label>
            <div class="shot">
              <button type="button" class="btn ghost upload" data-up="${idx}">📷 ${t.img?"Ganti":"Upload"}</button>
              ${t.img?`<img class="thumb" src="${escapeHtml(t.img)}" data-view="${idx}" title="Klik untuk perbesar" />
                       <button type="button" class="btn ghost rmimg" data-rmimg="${idx}">Hapus foto</button>`:""}
              <input type="file" accept="image/*" data-file="${idx}" hidden />
            </div>
          </div>
        </div>`;
      box.appendChild(row);
    });
    // ensure datalist for markets exists
    if(!document.getElementById("mkList")){
      const dl=document.createElement("datalist");dl.id="mkList";
      MARKETS.forEach(m=>{const o=document.createElement("option");o.value=m;dl.appendChild(o)});
      document.body.appendChild(dl);
    }
    updateDaySummary();
  }

  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  function terisi(t){
    return String(t.pnl===undefined?"":t.pnl).trim()!=="" || String(t.market||"").trim()!=="" || !!t.result || !!t.img;
  }
  function setCount(n){
    n=Math.max(0,Math.floor(n||0));
    if(n>200)n=200;
    if(n<editTrades.length){
      const hilang=editTrades.slice(n).filter(terisi).length;
      if(hilang>0 && !confirm("Mengurangi jumlah posisi akan menghapus "+hilang+" posisi yang sudah terisi. Lanjutkan?")){
        document.getElementById("mCount").value=editTrades.length;
        return;
      }
    }
    while(editTrades.length<n)editTrades.push({dir:"Long",pnl:"",market:"",result:"",img:""});
    while(editTrades.length>n)editTrades.pop();
    document.getElementById("mCount").value=editTrades.length;
    renderPositions();
  }

  function updateDaySummary(){
    let net=0,win=0,loss=0;
    editTrades.forEach(t=>{const p=num(t.pnl);net+=p;if(p>0)win++;else if(p<0)loss++;});
    document.getElementById("dsCount").textContent=editTrades.length;
    const pnlEl=document.getElementById("dsPnl");
    pnlEl.textContent=money(net);
    pnlEl.className="v "+(net>0?"pos":(net<0?"neg":""));
    document.getElementById("dsWL").textContent=win+" / "+loss;
  }

  // event delegation inside positions
  document.getElementById("mPositions").addEventListener("input",e=>{
    const f=e.target.getAttribute("data-f");
    if(f){
      const i=+e.target.getAttribute("data-i");
      editTrades[i][f]=e.target.value;
      if(f==="pnl")updateDaySummary();
    }
  });
  document.getElementById("mPositions").addEventListener("change",e=>{
    if(e.target.hasAttribute("data-file")){
      const i=+e.target.getAttribute("data-file");
      const file=e.target.files[0];
      if(file)compressImage(file,url=>{editTrades[i].img=url;renderPositions();});
      return;
    }
    const f=e.target.getAttribute("data-f");
    if(f==="dir"){const i=+e.target.getAttribute("data-i");editTrades[i].dir=e.target.value;}
  });
  document.getElementById("mPositions").addEventListener("click",e=>{
    const el=e.target.closest("[data-rm],[data-res],[data-up],[data-view],[data-rmimg]");
    if(!el)return;
    if(el.hasAttribute("data-rm")){editTrades.splice(+el.getAttribute("data-rm"),1);renderPositions();return;}
    if(el.hasAttribute("data-res")){
      const i=+el.getAttribute("data-i"),v=el.getAttribute("data-res");
      editTrades[i].result=editTrades[i].result===v?"":v;renderPositions();return;
    }
    if(el.hasAttribute("data-up")){
      const i=+el.getAttribute("data-up");
      const inp=document.querySelector('input[data-file="'+i+'"]');if(inp)inp.click();return;
    }
    if(el.hasAttribute("data-view")){openLightbox(editTrades[+el.getAttribute("data-view")].img);return;}
    if(el.hasAttribute("data-rmimg")){editTrades[+el.getAttribute("data-rmimg")].img="";renderPositions();return;}
  });

  document.getElementById("mCount").addEventListener("input",e=>{
    const raw=(e.target.value||"").trim();
    if(raw==="")return;                 // sedang dihapus untuk diketik ulang: jangan hapus data
    const n=parseInt(raw,10);
    if(isNaN(n))return;
    setCount(n);
  });
  document.getElementById("mCount").addEventListener("blur",e=>{
    if((e.target.value||"").trim()==="")e.target.value=editTrades.length;
  });
  document.getElementById("mAddPos").addEventListener("click",()=>{editTrades.push({dir:"Long",pnl:"",market:"",result:"",img:""});renderPositions()});

  document.getElementById("mSave").addEventListener("click",()=>{
    if(editingSlot==null)return closeModal();
    const sheet=activeSheet();
    const date=document.getElementById("mDate").value;
    const note=document.getElementById("mNote").value.trim();
    const clean=editTrades.map(t=>({dir:t.dir||"Long",pnl:t.pnl===""?0:num(t.pnl),market:(t.market||"").trim(),result:t.result||"",img:t.img||""}));
    if(clean.length===0 && !date && !note){
      delete sheet.days[editingSlot];
    }else{
      sheet.days[editingSlot]={date:date,trades:clean,note:note};
    }
    save();render();closeModal();toast("Slot #"+editingSlot+" tersimpan");
  });
  document.getElementById("mClear").addEventListener("click",()=>{
    if(editingSlot==null)return closeModal();
    const sheet=activeSheet();
    delete sheet.days[editingSlot];
    save();render();closeModal();toast("Slot dikosongkan");
  });
  document.getElementById("mCancel").addEventListener("click",closeModal);
  document.getElementById("mClose").addEventListener("click",closeModal);
  document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape")return;
    const lb=document.getElementById("lightbox");
    if(lb.classList.contains("open")){lb.classList.remove("open");return;}
    if(document.getElementById("overlay").classList.contains("open"))closeModal();
  });

  // ---------- Sheet head editing ----------
  document.getElementById("sheetTitle").addEventListener("input",e=>{activeSheet().title=e.target.value;save();});
  document.getElementById("sheetTitle").addEventListener("blur",()=>render());
  document.getElementById("sheetMonth").addEventListener("input",e=>{activeSheet().month=e.target.value;save()});
  document.getElementById("sheetMonth").addEventListener("blur",()=>render());

  // ---------- Sheet nav ----------
  document.getElementById("sheetSelect").addEventListener("change",e=>{state.active=e.target.value;save();render(true)});
  document.getElementById("prevSheet").addEventListener("click",()=>{
    const i=state.sheets.findIndex(s=>s.id===state.active);
    if(i>0){state.active=state.sheets[i-1].id;save();render(true)}
  });
  document.getElementById("nextSheet").addEventListener("click",()=>{
    const i=state.sheets.findIndex(s=>s.id===state.active);
    if(i<state.sheets.length-1){state.active=state.sheets[i+1].id;save();render(true)}
  });
  document.getElementById("newSheet").addEventListener("click",()=>{
    const s=blankSheet(state.sheets.length+1);
    // carry over the market/title style: keep title base, clear month
    s.title="Jurnal Trading AB";
    state.sheets.push(s);state.active=s.id;save();render(true);
    toast("Halaman baru dibuat ✨");
    document.getElementById("sheetTitle").focus();
  });

  // ---------- Export / Import ----------
  document.getElementById("exportBtn").addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="jurnal-trading-ab-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);   // jangan dicabut sebelum unduhan mulai
    toast("Backup diunduh ⬇");
  });
  document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change",e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.sheets||!Array.isArray(d.sheets))throw new Error("format");
        if(!confirm("Impor akan MENGGANTI semua data saat ini. Lanjutkan?"))return;
        state=sanitize(d);
        if(!state.active&&state.sheets[0])state.active=state.sheets[0].id;
        if(state.currency!=="IDR"&&state.currency!=="USD")state.currency="USD";
        save();renderAccount();render(true);toast("Data berhasil diimpor ⬆");
      }catch(err){alert("File tidak valid: "+err.message)}
    };
    r.readAsText(file);e.target.value="";
  });

  // ---------- Currency ----------
  document.getElementById("curSelect").addEventListener("change",e=>{
    if(!state)return;
    state.currency=e.target.value;save();render();
    if(document.getElementById("overlay").classList.contains("open"))renderPositions();
    toast("Mata uang: "+(e.target.value==="IDR"?"Rupiah (Rp)":"Dollar ($)"));
  });

  // ---------- Screenshot (compress + lightbox) ----------
  function compressImage(file,cb){
    if(!file.type||file.type.indexOf("image/")!==0){toast("File harus berupa gambar");return;}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxW=1280;let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        cb(c.toDataURL("image/jpeg",0.7));
      };
      img.onerror=()=>toast("Gagal memuat gambar");
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
  function openLightbox(src){
    if(!src)return;
    document.getElementById("lightboxImg").src=src;
    document.getElementById("lightbox").classList.add("open");
  }
  document.getElementById("lightbox").addEventListener("click",()=>{
    document.getElementById("lightbox").classList.remove("open");
  });

  // ---------- Theme ----------
  const themeBtn=document.getElementById("themeBtn");
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme",t);
    const ic=document.getElementById("themeIcon");
    if(ic)ic.textContent=t==="light"?"☀":"🌙";
    lsSet("scalperTheme",t);
  }
  themeBtn.addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    applyTheme(cur);
  });
  applyTheme(lsGet("scalperTheme")||"dark");

  // ---------- Toast ----------
  let toastTimer=null;
  function toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"),2000);
  }

  // ---------- Auth UI ----------
  const MIN_PASS=8;          // syarat panjang password (sisi aplikasi)
  let authMode="login";
  let recovering=false;
  const authScreen=document.getElementById("authScreen");
  function showAuth(){authScreen.classList.add("show");}
  function hideAuth(){authScreen.classList.remove("show");}
  function authMsg(text,type){
    const m=document.getElementById("authMsg");
    m.textContent=text||"";m.className="auth-msg"+(type?(" "+type):"");
  }
  function authBtnLabel(){
    return authMode==="login"?"Masuk":authMode==="signup"?"Daftar":authMode==="forgot"?"Kirim Link Reset":"Simpan Sandi Baru";
  }
  function setAuthMode(m){
    authMode=m;
    const sub=document.getElementById("authSub");
    const submit=document.getElementById("authSubmit");
    const emailField=document.getElementById("authEmailField");
    const passField=document.getElementById("authPassField");
    const passInput=document.getElementById("authPass");
    const passLabel=document.getElementById("authPassLabel");
    const toggle=document.getElementById("authToggle");
    const forgot=document.getElementById("authForgot");
    emailField.style.display=(m==="reset")?"none":"";
    passField.style.display=(m==="forgot")?"none":"";
    forgot.style.display=(m==="login")?"block":"none";
    toggle.style.display=(m==="reset")?"none":"block";
    submit.textContent=authBtnLabel();
    authMsg("");
    if(m==="login"){
      sub.textContent="Masuk untuk mengakses jurnal tradingmu.";
      passLabel.textContent="Password";passInput.placeholder="password kamu";passInput.setAttribute("autocomplete","current-password");
      toggle.innerHTML='Belum punya akun? <a>Daftar di sini</a>';
    }else if(m==="signup"){
      sub.textContent="Buat akun baru untuk mulai mencatat. Datamu privat, hanya milikmu.";
      passLabel.textContent="Password";passInput.placeholder="minimal 8 karakter";passInput.setAttribute("autocomplete","new-password");
      toggle.innerHTML='Sudah punya akun? <a>Masuk di sini</a>';
    }else if(m==="forgot"){
      sub.textContent="Masukkan email akunmu. Kami kirim link untuk membuat sandi baru.";
      toggle.innerHTML='Ingat sandimu? <a>Kembali ke Masuk</a>';
    }else if(m==="reset"){
      sub.textContent="Buat sandi baru untuk akunmu.";
      passLabel.textContent="Sandi Baru";passInput.placeholder="minimal 8 karakter";passInput.setAttribute("autocomplete","new-password");passInput.value="";
    }
  }
  function translateAuthError(msg){
    if(/failed to fetch|networkerror|network request failed|load failed/i.test(msg))
      return "Tidak bisa terhubung ke server database. Cek koneksi internetmu; bila internet normal, server (Supabase) sedang nonaktif/tertidur dan perlu diaktifkan lagi dari dashboard Supabase.";
    if(/Invalid login credentials/i.test(msg))return "Email atau password salah.";
    if(/already registered|already been registered/i.test(msg))return "Email sudah terdaftar. Silakan Masuk.";
    if(/different from the old|should be different/i.test(msg))return "Sandi baru harus berbeda dari yang lama.";
    if(/at least \d+|Password should be/i.test(msg))return "Password terlalu pendek. Gunakan minimal 8 karakter.";
    if(/valid email|invalid format/i.test(msg))return "Format email tidak valid.";
    if(/Email not confirmed/i.test(msg))return "Email belum diverifikasi. Cek inbox kamu.";
    if(/rate limit|too many/i.test(msg))return "Terlalu banyak percobaan. Coba lagi beberapa saat.";
    return msg;
  }
  async function doAuth(){
    const email=(document.getElementById("authEmail").value||"").trim();
    const pass=document.getElementById("authPass").value||"";
    if(authMode!=="reset" && !email){authMsg("Email wajib diisi.","err");return;}
    if(authMode!=="forgot" && !pass){authMsg("Password wajib diisi.","err");return;}
    const btn=document.getElementById("authSubmit");
    btn.disabled=true;btn.textContent="Memproses…";
    try{
      if(authMode==="login"){
        const {error}=await sb.auth.signInWithPassword({email,password:pass});
        if(error)throw error;
      }else if(authMode==="signup"){
        if(pass.length<MIN_PASS){authMsg("Password minimal "+MIN_PASS+" karakter agar akunmu aman.","err");btn.disabled=false;btn.textContent=authBtnLabel();return;}
        const {data,error}=await sb.auth.signUp({email,password:pass});
        if(error)throw error;
        if(!data.session){setAuthMode("login");authMsg("Akun dibuat! Cek email untuk verifikasi, lalu Masuk.","ok");}
      }else if(authMode==="forgot"){
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
        if(error)throw error;
        setAuthMode("login");
        authMsg("Kalau email terdaftar, link reset sudah dikirim. Cek inbox & folder spam.","ok");
      }else if(authMode==="reset"){
        if(pass.length<MIN_PASS){authMsg("Sandi baru minimal "+MIN_PASS+" karakter.","err");btn.disabled=false;btn.textContent=authBtnLabel();return;}
        const {data,error}=await sb.auth.updateUser({password:pass});
        if(error)throw error;
        recovering=false;
        toast("Sandi berhasil diubah ✓");
        if(!currentUser)onLogin(data.user);else hideAuth();
      }
    }catch(e){authMsg(translateAuthError(e.message||String(e)),"err");}
    finally{btn.disabled=false;btn.textContent=authBtnLabel();}
  }
  function setupAuthUI(){
    document.body.classList.add("cloud");
    setAuthMode("login");
    document.getElementById("authToggle").addEventListener("click",e=>{
      if(e.target.tagName==="A")setAuthMode(authMode==="login"?"signup":"login");
    });
    document.getElementById("authForgot").addEventListener("click",e=>{
      if(e.target.tagName==="A")setAuthMode("forgot");
    });
    document.getElementById("authSubmit").addEventListener("click",doAuth);
    document.getElementById("authPass").addEventListener("keydown",e=>{if(e.key==="Enter")doAuth();});
    document.getElementById("authEmail").addEventListener("keydown",e=>{
      if(e.key!=="Enter")return;
      if(authMode==="forgot")doAuth();else document.getElementById("authPass").focus();
    });
    document.getElementById("logoutBtn").addEventListener("click",async()=>{
      clearTimeout(cloudTimer);
      try{await cloudSaveNow();}catch(e){}
      await sb.auth.signOut();
    });
  }
  async function onLogin(user){
    currentUser=user;
    hideAuth();
    const fn=document.getElementById("footNote");if(fn)fn.textContent="☁ Data tersinkron ke cloud & privat untuk akunmu ("+(user.email||"")+"). Bisa diakses dari perangkat mana saja.";
    setStatus("saved");
    try{
      state=await cloudLoad();
      if(!state.currency)state.currency="USD";
    }catch(e){
      toast("Gagal memuat data cloud: "+(e.message||e));
      const first=blankSheet();state={sheets:[first],active:first.id,currency:"USD"};
    }
    renderAccount();
    render(true);
  }

  // ---------- Account / Profile ----------
  function emailPrefix(email){return ((email||"").split("@")[0])||"Trader";}
  async function sha256hex(str){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function setAvatar(el,email,name){
    if(!el)return;
    const initial=((name||email||"?").trim().charAt(0)||"?").toUpperCase();
    el.innerHTML="";el.textContent=initial;el.style.background="var(--logo-grad)";
    if(email && window.crypto && crypto.subtle){
      try{
        const hash=await sha256hex(email.trim().toLowerCase());
        const img=new Image();img.className="avatar-img";img.alt="";
        img.onload=()=>{el.innerHTML="";el.style.background="none";el.appendChild(img);};
        img.src="https://www.gravatar.com/avatar/"+hash+"?d=404&s=160";
      }catch(e){}
    }
  }
  function renderAccount(){
    const email=currentUser?(currentUser.email||""):"";
    const profile=(state&&state.profile)||{};
    const nickname=profile.nickname||emailPrefix(email);
    const desc=profile.description||"";
    const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
    set("accountName",nickname);set("menuNickname",nickname);set("menuEmail",email||"—");
    const pn=document.getElementById("profNickname");if(pn)pn.value=nickname;
    const pd=document.getElementById("profDesc");if(pd)pd.value=desc;
    setAvatar(document.getElementById("avatar"),email,nickname);
    setAvatar(document.getElementById("avatarLg"),email,nickname);
  }
  (function setupAccount(){
    const btn=document.getElementById("accountBtn");if(!btn)return;
    btn.addEventListener("click",e=>{e.stopPropagation();document.getElementById("accountMenu").classList.toggle("open");});
    document.addEventListener("click",e=>{
      const acc=document.getElementById("account");
      if(acc && !acc.contains(e.target))document.getElementById("accountMenu").classList.remove("open");
    });
    document.getElementById("profSave").addEventListener("click",()=>{
      if(!state)return;
      state.profile={
        nickname:document.getElementById("profNickname").value.trim(),
        description:document.getElementById("profDesc").value.trim()
      };
      save();renderAccount();toast("Profil tersimpan ✓");
    });
  })();

  // ---------- Boot ----------
  async function boot(){
    if(CLOUD && window.supabase){
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      setupAuthUI();
      showAuth();
      sb.auth.onAuthStateChange((event,session)=>{
        setTimeout(()=>{
          if(event==="PASSWORD_RECOVERY"){ recovering=true; showAuth(); setAuthMode("reset"); return; }
          if(session&&session.user){ if(recovering)return; if(!currentUser)onLogin(session.user); }
          else { currentUser=null; state=null; recovering=false; showAuth(); }
        },0);
      });
    }else{
      if(CLOUD && !window.supabase){toast("Gagal memuat pustaka cloud — cek koneksi internet.");}
      state=localLoad();
      if(!state.currency)state.currency="USD";
      render(true);
    }
  }
  boot();
})();
</script>
</body>
